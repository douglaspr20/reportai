services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: reportai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reportai
      POSTGRES_PASSWORD: reportai
      POSTGRES_DB: reportai
    ports:
      - "5433:5432"
    volumes:
      - reportai_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportai -d reportai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reportai_pgdata:
